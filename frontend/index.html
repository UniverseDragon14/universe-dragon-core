<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UD 3D Core</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#hud {
  position: absolute;
  top: 20px;
  left: 20px;
  color: cyan;
  font-family: monospace;
  max-width: 400px;
}
button {
  background: black;
  border: 1px solid cyan;
  color: cyan;
  padding: 10px;
  margin-top: 10px;
  cursor: pointer;
}
button:hover { background: #001a1a; }
#chat-panel {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#projects-panel {
  margin-top: 20px;
  padding: 10px;
  border: 1px solid #003333;
  background: rgba(0, 0, 0, 0.6);
  font-size: 12px;
}
#projects-list {
  margin-top: 8px;
  display: grid;
  gap: 6px;
}
.project-card {
  border: 1px solid #004444;
  padding: 8px;
  background: rgba(0, 20, 20, 0.6);
}
.project-name {
  color: #aaffff;
  font-weight: bold;
}
.project-desc {
  color: #7fe0e0;
}
.project-status {
  color: #66ff99;
  font-size: 11px;
}
#messages {
  background: rgba(0,0,0,0.7);
  border: 1px solid #005555;
  padding: 10px;
  height: 200px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.5;
}
.msg-user { color: #aaffff; }
.msg-ai   { color: #00ff99; }
#chat-input {
  background: black;
  border: 1px solid cyan;
  color: cyan;
  padding: 8px;
  font-family: monospace;
  font-size: 13px;
  width: 100%;
  box-sizing: border-box;
}
#send-btn {
  width: 100%;
}
#status {
  font-size: 11px;
  color: #557777;
  min-height: 16px;
}
</style>
</head>
<body>

<div id="hud">
  <h2>UNIVERSE DRAGON CORE</h2>
  <button onclick="setMode('nova')">NOVA MODE</button>
  <button onclick="setMode('dragon')">DRAGON MODE</button>
  <div id="current-mode" style="margin-top:8px;font-size:12px;color:#557777;">Mode: NOVA</div>
  <div id="projects-panel">
    <div style="color:#66cccc;font-weight:bold;">Projects</div>
    <button id="projects-btn" onclick="loadProjects()">LIST PROJECTS</button>
    <div id="projects-status" style="color:#557777;font-size:11px;min-height:14px;" role="status" aria-live="polite"></div>
    <div id="projects-list" role="region" aria-label="Projects list"></div>
  </div>
  <div id="chat-panel">
    <div id="messages"></div>
    <input id="chat-input" type="text" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">SEND</button>
    <div id="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Grid (TRON floor)
const grid = new THREE.GridHelper(100, 100, 0x00ffff, 0x003333);
scene.add(grid);

// Glowing cube core
const geometry = new THREE.BoxGeometry();
const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe:true });
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

camera.position.z = 5;

function animate() {
  requestAnimationFrame(animate);
  cube.rotation.x += 0.01;
  cube.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();

let currentMode = 'nova';

function setMode(mode) {
  currentMode = mode;
  document.getElementById('current-mode').textContent = 'Mode: ' + mode.toUpperCase();
  if (mode === 'nova') {
    cube.material.color.set(0x00ffff);
  } else {
    cube.material.color.set(0xff5500);
  }
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  const messages = document.getElementById('messages');
  const status = document.getElementById('status');

  messages.innerHTML += `<div class="msg-user">YOU: ${escapeHtml(msg)}</div>`;
  input.value = '';
  input.disabled = true;
  document.getElementById('send-btn').disabled = true;
  status.textContent = 'Thinking...';
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: currentMode, message: msg })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Request failed');
    }

    const data = await res.json();
    messages.innerHTML += `<div class="msg-ai">${escapeHtml(data.reply)}</div>`;
  } catch (e) {
    messages.innerHTML += `<div style="color:#ff4444;">ERROR: ${escapeHtml(e.message)}</div>`;
  } finally {
    input.disabled = false;
    document.getElementById('send-btn').disabled = false;
    status.textContent = '';
    messages.scrollTop = messages.scrollHeight;
    input.focus();
  }
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadProjects() {
  const status = document.getElementById('projects-status');
  const list = document.getElementById('projects-list');
  const btn = document.getElementById('projects-btn');
  const formatErrorMessage = "Unable to display projects due to an unexpected response format.";

  status.textContent = 'Loading...';
  btn.disabled = true;
  list.innerHTML = '';

  try {
    const res = await fetch('/api/projects');
    if (!res.ok) {
      const text = await res.text();
      let detail = `Request failed with status ${res.status}`;
      try {
        const err = JSON.parse(text);
        detail = err.detail || detail;
      } catch {
        if (text) detail = `${detail}: ${text}`;
      }
      throw new Error(detail);
    }
    const data = await res.json();
    if (!Array.isArray(data.projects)) {
      status.textContent = '';
      list.innerHTML = `<div style="color:#ff6666;">${escapeHtml(formatErrorMessage)}</div>`;
      return;
    }
    if (data.projects.length === 0) {
      list.innerHTML = '<div style="color:#888;">No projects found.</div>';
      return;
    }
    list.innerHTML = data.projects.map(p => `
      <div class="project-card">
        <div class="project-name">${escapeHtml(p.name || 'Unnamed Project')}</div>
        <div class="project-desc">${escapeHtml(p.description || '')}</div>
        <div class="project-status">Status: ${escapeHtml(p.status || 'unknown')}</div>
      </div>
    `).join('');
    status.textContent = 'Loaded projects.';
  } catch (e) {
    list.innerHTML = `<div style="color:#ff6666;">ERROR: ${escapeHtml(e.message)}</div>`;
    status.textContent = 'Failed to load projects.';
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
